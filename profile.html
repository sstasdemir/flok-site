<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flok profili</title>
    <meta name="description" content="Bu profil Flok'ta." />
    <meta property="og:site_name" content="Flok" />
    <meta property="og:title" content="Flok'ta bir profil" />
    <meta property="og:description" content="Profili görmek ve takip etmek için Flok'ta aç." />
    <meta property="og:image" content="https://flok.ist/share/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#1f3d2e" />
    <link rel="apple-touch-icon" href="/share/apple-touch-icon.png" />
    <link rel="stylesheet" href="/share/style.css" />
  </head>
  <body data-kind="profile">
    <div class="backdrop" aria-hidden="true"></div>
    <main>
      <header class="brand">
        <img src="/share/icon-512.png" alt="" />
        <span>Flok</span>
      </header>
      <div class="card-slot">
        <article class="card profile" aria-busy="true">
          <div class="avatar skeleton"></div>
          <div class="card-body">
            <div class="skeleton line" style="width: 40%"></div>
            <div class="skeleton title"></div>
          </div>
        </article>
      </div>
      <nav class="actions">
        <a class="button primary" data-action="open" href="#">Flok'ta aç</a>
        <a class="button secondary" data-action="store" href="#">App Store</a>
      </nav>
      <p class="hint"></p>
    </main>
    <script src="/share/app.js"></script>
  </body>
</html>
